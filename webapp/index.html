<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .top-right-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .icon-btn {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: #222;
        }

        #display {
            font-size: 6rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
        }

        #task-display {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 2rem;
            opacity: 0.7;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal.active {
            display: flex;
        }

        #modal-content {
            text-align: center;
        }

        #modal h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        #task-input {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            font-size: 1.5rem;
            padding: 1rem;
            width: 500px;
            max-width: 90vw;
            text-align: center;
        }

        #task-input:focus {
            outline: none;
            border-color: #fff;
        }

        #modify-modal,
        #settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modify-modal.active,
        #settings-modal.active {
            display: flex;
        }

        #reflection-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #reflection-modal.active {
            display: flex;
        }

        #reflection-modal-content {
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        #reflection-modal h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .reflection-section {
            margin-bottom: 2rem;
            text-align: left;
        }

        .reflection-section label {
            display: block;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .reflection-textarea {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            font-size: 1rem;
            padding: 0.8rem;
            width: 100%;
            min-height: 80px;
            resize: vertical;
        }

        .reflection-textarea:focus {
            outline: none;
            border-color: #fff;
            background-color: #111;
        }

        .productivity-options {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .productivity-btn {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.5rem;
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .productivity-btn:hover {
            background-color: #222;
        }

        .productivity-btn.selected {
            background-color: #333;
            border-color: #fff;
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        #reflection-save-btn,
        #reflection-skip-btn {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            font-size: 1.2rem;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
            min-width: 200px;
        }

        #reflection-save-btn:hover,
        #reflection-skip-btn:hover {
            background-color: #222;
        }

        #modify-modal-content,
        #settings-modal-content {
            text-align: center;
        }

        #modify-modal h2,
        #settings-modal h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        #modify-options,
        #settings-options {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        #modify-options button,
        #settings-options button {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            font-size: 1.2rem;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: background-color 0.2s;
            min-width: 400px;
        }

        #modify-options button:hover,
        #modify-options button:focus,
        #settings-options button:hover,
        #settings-options button:focus {
            background-color: #222;
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        .time-input-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .time-input {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            font-size: 1.2rem;
            padding: 0.5rem;
            width: 60px;
            text-align: center;
        }

        .time-input:focus {
            outline: none;
            border-color: #fff;
            background-color: #111;
        }

        .time-separator {
            font-size: 1.5rem;
            font-weight: bold;
        }

        #instructions {
            font-size: 0.9rem;
            margin-top: 3rem;
            opacity: 0.5;
            text-align: center;
        }

        #status {
            font-size: 1.2rem;
            margin-top: 1rem;
            opacity: 0.6;
        }

        #main-view,
        #calendar-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
        }

        #calendar-view {
            display: none;
            padding: 100px 20px 20px;
        }

        #calendar-view.active {
            display: flex;
        }

        #main-view.hidden {
            display: none;
        }

        #sessions-list {
            width: 100%;
            max-width: 800px;
            margin-bottom: 3rem;
        }

        .session-item {
            background-color: #000;
            border: 2px solid #fff;
            padding: 1.5rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        .session-task {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .session-time {
            font-size: 1rem;
            opacity: 0.7;
        }

        .session-reflection {
            font-size: 0.9rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid #333;
        }

        .reflection-item {
            margin-bottom: 0.5rem;
        }

        .reflection-label {
            opacity: 0.6;
            font-size: 0.85rem;
        }

        .empty-state {
            font-size: 1.5rem;
            opacity: 0.5;
            text-align: center;
            margin-top: 3rem;
        }

        #calendar-export-btn {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Comic Mono', monospace;
            font-size: 1rem;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #calendar-export-btn:hover {
            background-color: #222;
        }
    </style>
</head>

<body>
    <div class="top-right-buttons">
        <button id="nav-btn" class="icon-btn">📅</button>
        <button id="settings-btn" class="icon-btn">⚙️</button>
    </div>

    <div id="main-view">
        <div id="display"></div>
        <div id="status"></div>
        <div id="task-display"></div>
        <div id="instructions">Press Cmd+Enter (Mac) or Ctrl+Enter (Windows) to start a 25-minute Pomodoro</div>
    </div>

    <div id="calendar-view">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">Your Sessions</h1>
        <div id="sessions-list"></div>
        <button id="calendar-export-btn">Export to Google Calendar</button>
    </div>

    <div id="modal">
        <div id="modal-content">
            <h2>What will you work on?</h2>
            <input type="text" id="task-input" placeholder="Enter your task..." />
        </div>
    </div>

    <div id="modify-modal">
        <div id="modify-modal-content">
            <h2>Modify Timer</h2>
            <div id="modify-options">
                <div style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
                    <div style="font-size: 1rem; opacity: 0.8;">Change timer to:</div>
                    <div class="time-input-container">
                        <input type="number" id="hours-input" class="time-input" value="0" min="0" max="23"
                            placeholder="HH" />
                        <span class="time-separator">:</span>
                        <input type="number" id="minutes-input" class="time-input" value="25" min="0" max="59"
                            placeholder="MM" />
                        <span class="time-separator">:</span>
                        <input type="number" id="seconds-input" class="time-input" value="0" min="0" max="59"
                            placeholder="SS" />
                    </div>
                    <button id="change-timer-btn">Set Timer (Enter)</button>
                </div>
                <button id="end-btn">End Early (E)</button>
                <button id="cancel-btn">Cancel (Esc)</button>
            </div>
        </div>
    </div>

    <div id="settings-modal">
        <div id="settings-modal-content">
            <h2>Settings</h2>
            <div id="settings-options">
                <div style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
                    <div style="font-size: 1rem; opacity: 0.8;">Default Timer Duration:</div>
                    <div class="time-input-container">
                        <input type="number" id="settings-hours-input" class="time-input" value="0" min="0" max="23"
                            placeholder="HH" />
                        <span class="time-separator">:</span>
                        <input type="number" id="settings-minutes-input" class="time-input" value="25" min="0" max="59"
                            placeholder="MM" />
                        <span class="time-separator">:</span>
                        <input type="number" id="settings-seconds-input" class="time-input" value="0" min="0" max="59"
                            placeholder="SS" />
                    </div>
                </div>
                <button id="settings-save-btn">Save (Enter)</button>
                <button id="settings-cancel-btn">Cancel (Esc)</button>
            </div>
        </div>
    </div>

    <div id="reflection-modal">
        <div id="reflection-modal-content">
            <h2>Session Complete! 🎉</h2>

            <div class="reflection-section">
                <label>What did you accomplish?</label>
                <textarea id="accomplishments-input" class="reflection-textarea"
                    placeholder="Optional: Share what you completed..."></textarea>
            </div>

            <div class="reflection-section">
                <label>How productive did this session feel?</label>
                <div class="productivity-options">
                    <button class="productivity-btn" data-feeling="happy">😊</button>
                    <button class="productivity-btn" data-feeling="meh">😐</button>
                    <button class="productivity-btn" data-feeling="sad">☹️</button>
                </div>
            </div>

            <div class="reflection-section">
                <label>What were your biggest blockers?</label>
                <textarea id="blockers-input" class="reflection-textarea"
                    placeholder="Optional: Note any challenges or obstacles..."></textarea>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                <button id="reflection-save-btn">Save Reflection</button>
                <button id="reflection-skip-btn">Skip</button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const statusEl = document.getElementById('status');
        const taskDisplay = document.getElementById('task-display');
        const modal = document.getElementById('modal');
        const taskInput = document.getElementById('task-input');
        const instructions = document.getElementById('instructions');
        const modifyModal = document.getElementById('modify-modal');
        const continueBtn = document.getElementById('change-timer-btn');
        const endBtn = document.getElementById('end-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const hoursInput = document.getElementById('hours-input');
        const minutesInput = document.getElementById('minutes-input');
        const secondsInput = document.getElementById('seconds-input');
        const settingsBtn = document.getElementById('settings-btn');
        const navBtn = document.getElementById('nav-btn');
        const settingsModal = document.getElementById('settings-modal');
        const settingsHoursInput = document.getElementById('settings-hours-input');
        const settingsMinutesInput = document.getElementById('settings-minutes-input');
        const settingsSecondsInput = document.getElementById('settings-seconds-input');
        const settingsSaveBtn = document.getElementById('settings-save-btn');
        const settingsCancelBtn = document.getElementById('settings-cancel-btn');
        const mainView = document.getElementById('main-view');
        const calendarView = document.getElementById('calendar-view');
        const sessionsList = document.getElementById('sessions-list');
        const calendarExportBtn = document.getElementById('calendar-export-btn');
        const reflectionModal = document.getElementById('reflection-modal');
        const accomplishmentsInput = document.getElementById('accomplishments-input');
        const blockersInput = document.getElementById('blockers-input');
        const reflectionSaveBtn = document.getElementById('reflection-save-btn');
        const reflectionSkipBtn = document.getElementById('reflection-skip-btn');
        const productivityBtns = document.querySelectorAll('.productivity-btn');

        let timerInterval = null;
        let remainingSeconds = 0;
        let isTimerRunning = false;
        let completedSessions = [];
        let currentSessionStart = null;
        let defaultTimerSeconds = 25 * 60;
        let isCalendarView = false;
        let currentSessionData = null;

        // Request notification permission on load
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Display current time
        function updateClock() {
            if (!isTimerRunning) {
                const now = new Date();
                display.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
            }
        }

        // Update clock every second when not timing
        setInterval(() => {
            if (!isTimerRunning) {
                updateClock();
            }
        }, 1000);

        updateClock();

        // Format seconds to HH:MM:SS or MM:SS
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            } else {
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }

        // Start timer
        function startTimer(task) {
            isTimerRunning = true;
            remainingSeconds = defaultTimerSeconds;
            taskDisplay.textContent = task;
            statusEl.textContent = 'Focus time! 🍅';
            instructions.style.display = 'none';
            currentSessionStart = new Date();

            display.textContent = formatTime(remainingSeconds);

            timerInterval = setInterval(() => {
                remainingSeconds--;
                display.textContent = formatTime(remainingSeconds);

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerComplete();
                }
            }, 1000);
        }

        // Timer complete
        function timerComplete() {
            isTimerRunning = false;
            const endTime = new Date();

            // Store session data temporarily
            currentSessionData = {
                task: taskDisplay.textContent,
                startTime: currentSessionStart,
                endTime: endTime,
                accomplishments: '',
                productivity: null,
                blockers: ''
            };

            statusEl.textContent = 'Pomodoro complete! Great work! 🎉';
            display.textContent = '00:00';

            // Show notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Pomodoro Complete!', {
                    body: 'Time for a break! You completed: ' + taskDisplay.textContent,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="75" font-size="75">🍅</text></svg>'
                });
            }

            // Show reflection modal after a brief delay
            setTimeout(() => {
                showReflectionModal();
            }, 1500);
        }

        // Keyboard shortcut and modal handling
        document.addEventListener('keydown', (e) => {
            // Handle Cmd/Ctrl + Comma for settings
            if ((e.metaKey || e.ctrlKey) && e.key === ',') {
                e.preventDefault();
                settingsBtn.click();
                return;
            }

            // Handle Cmd/Ctrl + Enter for starting or modifying timer
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();

                if (!isTimerRunning) {
                    showStartModal();
                } else if (!modifyModal.classList.contains('active')) {
                    showModifyModal();
                }
                return;
            }

            // Handle keyboard shortcuts in modify modal
            if (modifyModal.classList.contains('active')) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    modifyModal.classList.remove('active');
                } else if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
                    e.preventDefault();
                    continueBtn.click();
                } else if (e.key === 'e' || e.key === 'E') {
                    e.preventDefault();
                    endBtn.click();
                }
            }
        });

        // Handle task input
        taskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const task = taskInput.value.trim();

                if (task) {
                    modal.classList.remove('active');
                    startTimer(task);
                }
            } else if (e.key === 'Escape') {
                modal.classList.remove('active');
            }
        });

        // Show start modal
        function showStartModal() {
            modal.classList.add('active');
            taskInput.value = '';
            taskInput.focus();
        }

        // Show modify modal
        function showModifyModal() {
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;

            hoursInput.value = hours;
            minutesInput.value = minutes;
            secondsInput.value = seconds;

            modifyModal.classList.add('active');
            hoursInput.focus();
            hoursInput.select();
        }

        // Change timer button
        continueBtn.addEventListener('click', () => {
            const hours = parseInt(hoursInput.value) || 0;
            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;

            const newTotalSeconds = (hours * 3600) + (minutes * 60) + seconds;

            if (newTotalSeconds > 0) {
                remainingSeconds = newTotalSeconds;
                modifyModal.classList.remove('active');
                statusEl.textContent = `Timer changed to ${formatTime(remainingSeconds)}! 🍅`;
            } else {
                alert('Please enter a valid time greater than 0');
            }
        });

        // End timer early
        endBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            modifyModal.classList.remove('active');
            timerComplete();
        });

        // Cancel modify modal
        cancelBtn.addEventListener('click', () => {
            modifyModal.classList.remove('active');
        });

        // Auto-advance between time inputs
        function setupTimeInputNavigation() {
            const inputs = [hoursInput, minutesInput, secondsInput];

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (input.value.length === 1 && parseInt(input.value) >= 0) {
                        const val = parseInt(input.value);
                        if (index > 0 && val >= 6) {
                            input.value = '0' + val;
                            if (index < inputs.length - 1) {
                                inputs[index + 1].focus();
                                inputs[index + 1].select();
                            }
                        }
                    } else if (input.value.length === 2) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                            inputs[index + 1].select();
                        }
                    }

                    const maxVals = [23, 59, 59];
                    if (parseInt(input.value) > maxVals[index]) {
                        input.value = maxVals[index];
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                        e.preventDefault();
                        inputs[index + 1].focus();
                        inputs[index + 1].select();
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        e.preventDefault();
                        inputs[index - 1].focus();
                        inputs[index - 1].select();
                    }
                });
            });
        }

        setupTimeInputNavigation();

        // Navigation button - toggle between main and calendar view
        navBtn.addEventListener('click', () => {
            isCalendarView = !isCalendarView;

            if (isCalendarView) {
                mainView.classList.add('hidden');
                calendarView.classList.add('active');
                navBtn.textContent = '🏠';
                renderSessions();
            } else {
                mainView.classList.remove('hidden');
                calendarView.classList.remove('active');
                navBtn.textContent = '📅';
            }
        });

        // Render sessions list
        function renderSessions() {
            sessionsList.innerHTML = '';

            if (completedSessions.length === 0) {
                sessionsList.innerHTML = '<div class="empty-state">No completed sessions yet. Start a Pomodoro to see it here!</div>';
                return;
            }

            const sortedSessions = [...completedSessions].sort((a, b) => b.startTime - a.startTime);

            sortedSessions.forEach(session => {
                const sessionEl = document.createElement('div');
                sessionEl.className = 'session-item';

                const taskEl = document.createElement('div');
                taskEl.className = 'session-task';
                taskEl.textContent = session.task;

                const timeEl = document.createElement('div');
                timeEl.className = 'session-time';
                const startStr = session.startTime.toLocaleString('en-GB', {
                    hour12: false,
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                const endStr = session.endTime.toLocaleTimeString('en-GB', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit'
                });
                timeEl.textContent = `${startStr} - ${endStr}`;

                sessionEl.appendChild(taskEl);
                sessionEl.appendChild(timeEl);

                // Add reflection data if available
                if (session.accomplishments || session.productivity || session.blockers) {
                    const reflectionEl = document.createElement('div');
                    reflectionEl.className = 'session-reflection';

                    if (session.productivity) {
                        const productivityEl = document.createElement('div');
                        productivityEl.className = 'reflection-item';
                        const emoji = session.productivity === 'happy' ? '😊' : session.productivity === 'meh' ? '😐' : '☹️';
                        productivityEl.innerHTML = `<span class="reflection-label">Felt:</span> ${emoji}`;
                        reflectionEl.appendChild(productivityEl);
                    }

                    if (session.accomplishments) {
                        const accomplishmentsEl = document.createElement('div');
                        accomplishmentsEl.className = 'reflection-item';
                        accomplishmentsEl.innerHTML = `<span class="reflection-label">Accomplished:</span> ${session.accomplishments}`;
                        reflectionEl.appendChild(accomplishmentsEl);
                    }

                    if (session.blockers) {
                        const blockersEl = document.createElement('div');
                        blockersEl.className = 'reflection-item';
                        blockersEl.innerHTML = `<span class="reflection-label">Blockers:</span> ${session.blockers}`;
                        reflectionEl.appendChild(blockersEl);
                    }

                    sessionEl.appendChild(reflectionEl);
                }

                sessionsList.appendChild(sessionEl);
            });
        }

        // Calendar export button
        calendarExportBtn.addEventListener('click', () => {
            if (completedSessions.length === 0) {
                alert('No completed sessions to export!');
                return;
            }

            let csvContent = 'Subject,Start Date,Start Time,End Date,End Time,Description\n';

            completedSessions.forEach(session => {
                const startDate = session.startTime.toLocaleDateString('en-US');
                const startTime = session.startTime.toLocaleTimeString('en-US', { hour12: false });
                const endDate = session.endTime.toLocaleDateString('en-US');
                const endTime = session.endTime.toLocaleTimeString('en-US', { hour12: false });

                const taskName = session.task.replace(/"/g, '""');

                csvContent += `"${taskName}",${startDate},${startTime},${endDate},${endTime},Pomodoro session\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `pomodoro_sessions_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert(`Exported ${completedSessions.length} session(s)! Import this CSV into Google Calendar.`);
        });

        // Settings button
        settingsBtn.addEventListener('click', () => {
            const hours = Math.floor(defaultTimerSeconds / 3600);
            const minutes = Math.floor((defaultTimerSeconds % 3600) / 60);
            const seconds = defaultTimerSeconds % 60;

            settingsHoursInput.value = hours;
            settingsMinutesInput.value = minutes;
            settingsSecondsInput.value = seconds;

            settingsModal.classList.add('active');
            settingsHoursInput.focus();
            settingsHoursInput.select();
        });

        // Save settings
        settingsSaveBtn.addEventListener('click', () => {
            const hours = parseInt(settingsHoursInput.value) || 0;
            const minutes = parseInt(settingsMinutesInput.value) || 0;
            const seconds = parseInt(settingsSecondsInput.value) || 0;

            const newDefaultSeconds = (hours * 3600) + (minutes * 60) + seconds;

            if (newDefaultSeconds > 0) {
                defaultTimerSeconds = newDefaultSeconds;
                settingsModal.classList.remove('active');
                alert(`Default timer set to ${formatTime(defaultTimerSeconds)}!`);
            } else {
                alert('Please enter a valid time greater than 0');
            }
        });

        // Cancel settings
        settingsCancelBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        // Handle settings modal keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (settingsModal.classList.contains('active')) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    settingsModal.classList.remove('active');
                } else if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
                    e.preventDefault();
                    settingsSaveBtn.click();
                }
            }
        });

        // Setup time input navigation for settings
        function setupSettingsTimeInputNavigation() {
            const inputs = [settingsHoursInput, settingsMinutesInput, settingsSecondsInput];

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (input.value.length === 1 && parseInt(input.value) >= 0) {
                        const val = parseInt(input.value);
                        if (index > 0 && val >= 6) {
                            input.value = '0' + val;
                            if (index < inputs.length - 1) {
                                inputs[index + 1].focus();
                                inputs[index + 1].select();
                            }
                        }
                    } else if (input.value.length === 2) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                            inputs[index + 1].select();
                        }
                    }

                    const maxVals = [23, 59, 59];
                    if (parseInt(input.value) > maxVals[index]) {
                        input.value = maxVals[index];
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                        e.preventDefault();
                        inputs[index + 1].focus();
                        inputs[index + 1].select();
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        e.preventDefault();
                        inputs[index - 1].focus();
                        inputs[index - 1].select();
                    }
                });
            });
        }

        setupSettingsTimeInputNavigation();

        // Show reflection modal
        function showReflectionModal() {
            accomplishmentsInput.value = '';
            blockersInput.value = '';
            productivityBtns.forEach(btn => btn.classList.remove('selected'));
            reflectionModal.classList.add('active');
            accomplishmentsInput.focus();
        }

        // Handle productivity button clicks
        productivityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                productivityBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentSessionData.productivity = btn.dataset.feeling;
            });
        });

        // Save reflection
        reflectionSaveBtn.addEventListener('click', () => {
            saveReflection();
        });

        // Skip reflection
        reflectionSkipBtn.addEventListener('click', () => {
            saveReflection();
        });

        // Save reflection and complete session
        function saveReflection() {
            currentSessionData.accomplishments = accomplishmentsInput.value.trim();
            currentSessionData.blockers = blockersInput.value.trim();

            completedSessions.push(currentSessionData);
            currentSessionData = null;

            reflectionModal.classList.remove('active');

            // Reset UI
            taskDisplay.textContent = '';
            statusEl.textContent = '';
            instructions.style.display = 'block';
            updateClock();
        }

        // Handle reflection modal keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (reflectionModal.classList.contains('active')) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    reflectionSkipBtn.click();
                } else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    e.preventDefault();
                    reflectionSaveBtn.click();
                }
            }
        });
    </script>
</body>

</html>
